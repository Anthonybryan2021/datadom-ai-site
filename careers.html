<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carreras | DataDom.ai</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <style>
    .jobs-grid{display:grid;gap:24px}
    .job-card,.apply-panel{background:#fff;border:1px solid #d9dfe7;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
    .job-card h2,.apply-panel h2{margin:0 0 12px}
    .job-card p{margin:0 0 12px}
    .job-meta{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 18px}
    .job-meta span{background:#eef4f7;color:#0f4c5c;border-radius:999px;padding:6px 12px;font-size:.92rem}
    .apply-btn,.submit-btn{display:inline-block;background:#0f6d7a;color:#fff;text-decoration:none;border:none;border-radius:999px;padding:12px 18px;font-weight:600;cursor:pointer}
    .apply-btn:hover,.submit-btn:hover{background:#0c5a65}
    .apply-panel{margin-top:32px}
    .form-grid{display:grid;gap:16px}
    .form-row{display:grid;gap:8px}
    label{font-weight:600}
    input,select,textarea{width:100%;padding:12px 14px;border:1px solid #cfd8e3;border-radius:12px;font:inherit}
    textarea{min-height:140px;resize:vertical}
    .small-note{font-size:.95rem;color:#52606d}
    .inline-note{margin-top:10px;font-size:.9rem;color:#607080}
    .section-intro{margin-bottom:24px}
    @media (min-width: 860px){.jobs-grid{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav>
        <a class="brand-wrap" href="./index.html">
          <img src="./assets/img/datadom-logo.png" alt="DataDom logo" class="brand-logo">
          <span class="brand-text">DataDom.ai</span>
        </a>
        <a href="./index.html">Inicio</a>
        <a href="./services.html">Servicios</a>
        <a href="./about.html">Nosotros</a>
        <a href="./trust.html">Confianza</a>
        <a href="./contact.html">Contacto</a>
        <a href="./careers.html" aria-current="page">Carreras</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1>Carreras en DataDom.ai</h1>
      <div class="section-intro">
        <p>En este momento no estamos recibiendo nuevas aplicaciones.</p>
        <p class="small-note">Gracias por tu interés en formar parte de nuestro equipo; publicaremos futuras oportunidades directamente en esta página.</p>
      </div>

    </div>
  </main>

</body>
</html>
